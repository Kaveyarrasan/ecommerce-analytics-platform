# ============================================================================
# GitHub Actions CI/CD Pipeline for E-Commerce Analytics Platform
# ============================================================================
# This workflow replaces traditional Jenkins pipelines with GitHub Actions
# + Declarative Automation Bundles (DABs) for Databricks-native CI/CD.
#
# Pipeline stages:
#   1. Code checkout from GitHub
#   2. Validate DABs configuration
#   3. Deploy to dev environment
#   4. Run the ETL pipeline job (Bronze → Silver → Gold → Tests)
#   5. Report results
#
# Architecture Decision (ADR-005): GitHub Actions + DABs replaces Jenkins
#
# Node.js Compatibility (Updated: 2026-09-03):
#   - Runner: ubuntu-24.04 (comes with Node.js 20.x LTS)
#   - Actions: checkout@v4 and setup-python@v5 use Node.js 20
#   - All actions are compatible with GitHub's Node.js 20 requirement
#   - No conflicts between runner Node.js (20.x) and action requirements
# ============================================================================

name: E-Commerce Analytics CI/CD

# Required permissions for the workflow
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

# Prevent multiple workflows from running simultaneously
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABRICKS_HOST: https://dbc-5c760729-3532.cloud.databricks.com
  BUNDLE_TARGET: dev  # Use 'prod' for production deployments

jobs:
  validate-and-deploy:
    runs-on: ubuntu-24.04  # Explicitly use ubuntu-24.04 (latest LTS)
    timeout-minutes: 30  # Prevent workflows from hanging indefinitely
    
    steps:
      # Step 1: Checkout code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python with dependency caching
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'  # Cache pip dependencies for faster builds

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install databricks-cli
          databricks --version

      # Step 4: Configure Databricks authentication
      # Uses DATABRICKS_TOKEN secret stored in GitHub Secrets
      - name: Configure Databricks CLI
        run: |
          echo "[DEFAULT]" > ~/.databrickscfg
          echo "host = ${{ env.DATABRICKS_HOST }}" >> ~/.databrickscfg
          echo "token = ${{ secrets.DATABRICKS_TOKEN }}" >> ~/.databrickscfg

      # Step 5: Validate DABs configuration
      - name: Validate bundle
        run: |
          echo "🔍 Validating DABs configuration..."
          databricks bundle validate -t ${{ env.BUNDLE_TARGET }}
          echo "✅ Bundle validation passed!"

      # Step 6: Deploy bundle to target environment
      - name: Deploy bundle
        run: |
          echo "🚀 Deploying to ${{ env.BUNDLE_TARGET }} environment..."
          databricks bundle deploy -t ${{ env.BUNDLE_TARGET }}
          echo "✅ Deployment complete!"

      # Step 7: Run the ETL pipeline job
      - name: Run ETL pipeline
        run: |
          echo "🔄 Running E-Commerce ETL Pipeline..."
          databricks bundle run -t ${{ env.BUNDLE_TARGET }} ecommerce_etl_pipeline
          echo "✅ ETL Pipeline completed!"

      # Step 8: Report results
      - name: Report deployment status
        if: always()
        run: |
          echo "=========================================="
          echo "📊 CI/CD Pipeline Summary"
          echo "=========================================="
          echo "  Target: ${{ env.BUNDLE_TARGET }}"
          echo "  Status: ${{ job.status }}"
          echo "  Commit: ${{ github.sha }}"
          echo "  Branch: ${{ github.ref_name }}"
          echo "=========================================="