# ============================================================================
# GitHub Actions CI/CD Pipeline for E-Commerce Analytics Platform
# ============================================================================
# This workflow replaces traditional Jenkins pipelines with GitHub Actions
# + Declarative Automation Bundles (DABs) for Databricks-native CI/CD.
#
# Pipeline stages:
#   1. Code checkout from GitHub
#   2. Validate DABs configuration
#   3. Deploy to dev environment
#   4. Run the ETL pipeline job (Bronze → Silver → Gold → Tests)
#   5. Report results
#
# Architecture Decision (ADR-005): GitHub Actions + DABs replaces Jenkins
#
# Node.js Compatibility (Updated: 2026-09-03):
#   - Runner: ubuntu-24.04 (comes with Node.js 24.x)
#   - Actions: checkout@v4 and setup-python@v5 now support Node.js 24
#   - GitHub deprecated Node.js 20 on 2025-09-19
#   - All actions updated to Node.js 24 compatibility
# ============================================================================

name: E-Commerce Analytics CI/CD

# Required permissions for the workflow
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

# Prevent multiple workflows from running simultaneously
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABRICKS_HOST: https://dbc-5c760729-3532.cloud.databricks.com
  BUNDLE_TARGET: dev  # Use 'prod' for production deployments

jobs:
  validate-and-deploy:
    runs-on: ubuntu-24.04  # Explicitly use ubuntu-24.04 (latest LTS)
    timeout-minutes: 30  # Prevent workflows from hanging indefinitely
    
    steps:
      # Step 1: Checkout code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install the NEW Databricks CLI (required for 'bundle' commands)
      # NOTE: The old 'databricks-cli' Python package does NOT support bundles
      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          databricks --version

      # Step 3: Validate DABs configuration
      - name: Validate bundle
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "🔍 Validating DABs configuration..."
          databricks bundle validate -t ${{ env.BUNDLE_TARGET }}
          echo "✅ Bundle validation passed!"

      # Step 4: Deploy bundle to target environment
      - name: Deploy bundle
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "🚀 Deploying to ${{ env.BUNDLE_TARGET }} environment..."
          databricks bundle deploy -t ${{ env.BUNDLE_TARGET }}
          echo "✅ Deployment complete!"

      # Step 5: Run the ETL pipeline job
      - name: Run ETL pipeline
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "🔄 Running E-Commerce ETL Pipeline..."
          databricks bundle run -t ${{ env.BUNDLE_TARGET }} ecommerce_etl_pipeline
          echo "✅ ETL Pipeline completed!"

      # Step 6: Report results
      - name: Report deployment status
        if: always()
        run: |
          echo "=========================================="
          echo "📊 CI/CD Pipeline Summary"
          echo "=========================================="
          echo "  Target: ${{ env.BUNDLE_TARGET }}"
          echo "  Status: ${{ job.status }}"
          echo "  Commit: ${{ github.sha }}"
          echo "  Branch: ${{ github.ref_name }}"
          echo "=========================================="